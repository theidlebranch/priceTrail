name: Verify

on:
  schedule:
    # 00:00, 06:00, 12:00, and 18:00 UTC. GitHub may start this late.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# A pull request does not run this. The job uses the live database and
# can ask Wayback to save a page. The schedule runs only on the default branch.
permissions:
  contents: read

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # The pnpm scripts pass --env-file=.env. Node exits when that file
      # is missing. This file stays empty. The job environment above
      # already holds the three values, and Node keeps those.
      - name: Add an empty env file
        id: env-file
        if: steps.install.outcome == 'success'
        run: touch .env

      # A failed page still leaves the other two to run. A failed install,
      # or a cancelled job, does not start a visit.
      - name: Check Anthropic
        if: ${{ !cancelled() && steps.env-file.outcome == 'success' }}
        run: pnpm verify:anthropic

      - name: Check OpenAI
        if: ${{ !cancelled() && steps.env-file.outcome == 'success' }}
        run: pnpm verify:openai

      - name: Check Google
        if: ${{ !cancelled() && steps.env-file.outcome == 'success' }}
        run: pnpm verify:google
