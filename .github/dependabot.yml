version: 2
updates:
  - package-ecosystem: "npm" # "npm" also covers pnpm projects
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      major:
        applies-to: version-updates
        update-types: ["major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "ci"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
